<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="50%" stop-color="#04382A" />
      <stop offset="100%" stop-color="#021C15" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background with subtle squircle rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer gold ornamental hairline ring -->
  <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.4" />
  
  <!-- Subtle inner dashed border -->
  <rect x="36" y="36" width="440" height="440" rx="80" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="6,6" stroke-opacity="0.3" />

  <!-- Central Quranic Calligraphy Qaf 'ق' with two dots -->
  <g filter="url(#shadow)">
    <!-- Two dots of Qaf -->
    <circle cx="215" cy="145" r="22" fill="url(#goldGrad)" />
    <circle cx="297" cy="145" r="22" fill="url(#goldGrad)" />

    <!-- Head and swooping tail of Qaf -->
    <path d="M 256 195 C 290 195 316 218 316 250 C 316 280 292 300 260 300 C 235 300 216 284 216 260 C 216 242 228 228 246 228 C 258 228 266 235 266 245 C 266 253 259 258 250 258 C 248 258 245 257 242 255 C 243 270 254 280 270 280 C 288 280 300 264 300 246 C 300 226 280 212 254 212 C 220 212 190 238 190 278 C 190 326 226 362 280 362 C 342 362 384 316 388 240 L 404 240 C 400 328 350 382 278 382 C 212 382 170 338 170 276 C 170 226 206 195 256 195 Z" 
          fill="url(#goldGrad)" />
  </g>
</svg>
